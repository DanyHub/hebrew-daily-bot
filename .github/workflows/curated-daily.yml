name: Curated daily (theme + root)

# One themed pack (with 4 sentences) and one root card per day, from the curated content library.
# Sent to every subscriber registered through the Worker (see worker/README.md), each at their
# own level and language; falls back to the single chat in TELEGRAM_CHAT_ID without Cloudflare secrets.
# No AI is called at send time. Scheduled workflows only run from the default
# branch, so nothing is sent until this file is merged into it.

on:
  schedule:
    # Sun-Fri at 13:00 Israel time. GitHub cron is UTC only, and Israel is UTC+3 in summer and UTC+2 in
    # winter, so the job is scheduled at both 10:00 and 11:00 UTC and the "gate" step lets through only
    # the run that falls at 13:xx in Israel (the other one stops there).
    - cron: '0 10 * * 0-5'
    - cron: '0 11 * * 0-5'
  workflow_dispatch:
    inputs:
      level:
        description: 'Level (1 beginner, 2 intermediate, 3 advanced)'
        default: '1'
        type: choice
        options: ['1', '2', '3']
      lang:
        description: 'Language'
        default: 'fr'
        type: choice
        options: ['fr', 'en']
      date:
        description: 'Date to simulate (YYYY-MM-DD, empty = today)'
        required: false
        default: ''
      dry_run:
        description: 'Only print, do not send to Telegram'
        type: boolean
        default: false

jobs:
  send:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Gate (scheduled runs only go through at 13:xx Israel time)
        id: gate
        run: |
          HOUR=$(TZ=Asia/Jerusalem date +%H)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$HOUR" != "13" ]; then
            echo "It is $HOUR:xx in Israel, not 13:xx: skipping this run (the other cron covers it)."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.go == 'true'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.go == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - if: steps.gate.outputs.go == 'true'
        run: pip install -r requirements.txt
      - name: Validate content
        if: steps.gate.outputs.go == 'true'
        run: python -m hebbot.validate
      - name: Content runway (warns when fresh content is running low)
        if: steps.gate.outputs.go == 'true'
        run: python -m hebbot.order runway
      - name: Send daily messages
        if: steps.gate.outputs.go == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HEBBOT_LEVEL: ${{ github.event.inputs.level || vars.HEBBOT_LEVEL || '1' }}
          HEBBOT_LANG: ${{ github.event.inputs.lang || vars.HEBBOT_LANG || 'fr' }}
          DAILY_DATE: ${{ github.event.inputs.date }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ARGS=""   # whether unreviewed content is sent is decided by SEND_DRAFTS in hebbot/daily.py
          # With the Worker deployed, everyone who registered gets their own level and language.
          # Without Cloudflare secrets, fall back to the single chat in TELEGRAM_CHAT_ID.
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then ARGS="$ARGS --subscribers"; fi
          if [ -n "$DAILY_DATE" ]; then ARGS="$ARGS --date $DAILY_DATE"; fi
          if [ "$DRY_RUN" != "true" ]; then ARGS="$ARGS --send"; fi
          python -m hebbot.daily $ARGS
